name: Atualizar dispensas de licitação

on:
  schedule:
    # 11:00 UTC = 08:00 horário de Brasília (sem horário de verão).
    # O GitHub pode atrasar execuções agendadas em horários de pico —
    # não é garantido rodar no minuto exato.
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # permite clicar em "Run workflow" manualmente na aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    # A busca no estado inteiro leva ~1 min; o limite só evita travar se a API
    # do PNCP ficar pendurada. Se o script falhar sem obter dados, ele sai com
    # erro e o passo de commit não roda — o painel mantém os dados anteriores.
    timeout-minutes: 20
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o script de busca
        run: python buscar_dispensas.py --saida dispensas.json

      - name: Publicar o resultado se algo mudou
        run: |
          git config user.name "radar-dispensas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dispensas.json
          if git diff --cached --quiet; then
            echo "Nada mudou desde a última execução."
          else
            git commit -m "Atualiza dispensas.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
